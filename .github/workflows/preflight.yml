name: Verify live YouTube connections
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/preflight.py
        env:
          VICE_CITY_TOKEN: ${{ secrets.VICE_CITY_TOKEN }}
          KIDZZ_RHYTHM_TOKEN: ${{ secrets.KIDZZ_RHYTHM_TOKEN }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
