
name: Test Gemini AI Scripts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-gemini:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Vice City script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Vice City attempt $attempt of 5"

            if python scripts/generate_script.py vice_city short; then
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "Gemini generation failed after 5 attempts."
              exit 1
            fi

            echo "Waiting 30 seconds..."
            sleep 30
          done

      - name: Generate Kidzz Rhythm script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Kidzz Rhythm attempt $attempt of 5"

            if python scripts/generate_script.py kidzz_rhythm long; then
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "Gemini generation failed after 5 attempts."
              exit 1
            fi

            echo "Waiting 30 seconds..."
            sleep 30
          done

      - name: Save generated scripts
        uses: actions/upload-artifact@v4
        with:
          name: youtube-test-scripts
          path: output/*.json
          retention-days: 1
