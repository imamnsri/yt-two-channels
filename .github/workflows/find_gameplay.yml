name: Find reusable GTA footage
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Search multiple channels for reusable gameplay candidates
        run: python -u scripts/find_gameplay_sources.py
        env:
          VICE_CITY_TOKEN: ${{ secrets.VICE_CITY_TOKEN }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v4
        with:
          name: gta-gameplay-source-research
          path: output/gta_footage_candidates.json
          retention-days: 7
          if-no-files-found: error
