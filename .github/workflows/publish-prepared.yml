name: Publish prepared videos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [config/prepared_releases.json]
permissions:
  contents: write
concurrency:
  group: daily-video-production
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KIDZZ_RHYTHM_TOKEN: ${{ secrets.KIDZZ_RHYTHM_TOKEN }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Check uploader syntax
        run: python -m py_compile scripts/publish_prepared.py
      - name: Configure receipts
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
      - name: Upload checked original videos
        run: python -u scripts/publish_prepared.py
